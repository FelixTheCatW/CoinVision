[project]
name = "coinvision"
seed = 42

[data]
source_dir = "data/source"
manifest_dir = "data/manifests"
train_manifest = "data/manifests/train.csv"
val_manifest = "data/manifests/val.csv"
val_fraction = 0.2
image_size = [448, 224]
num_workers = 4
# The recipe below is the measured winner of the 5-fold comparison (configs/exp_combo.toml):
# 0.8758 +- 0.0199 last-digit accuracy against 0.8519 +- 0.0178 for the plain 30-epoch run.
augment = true
cache = true

[model]
backbone = "resnet18"
# From scratch resnet18 tops out at ~0.52 last-digit accuracy on this dataset; ImageNet init
# reaches ~0.84 in the same 30 epochs (runs/pre/metrics.json vs runs/ref/metrics.json).
pretrained = true
num_digits = 4
num_classes_per_digit = 10
dropout = 0.2

[train]
# 60 epochs belong to the winning recipe: its best epoch lands at 39-57, so the old 30-epoch
# budget was cutting training short.
epochs = 60
batch_size = 32
lr = 0.001
weight_decay = 0.0001
amp = false
num_workers = 4
deterministic = false
label_smoothing = 0.1
lr_schedule = "cosine"
warmup_epochs = 3
out_dir = "runs"

[infer]
checkpoint = "runs/pre/best.pt"
device = "auto"
