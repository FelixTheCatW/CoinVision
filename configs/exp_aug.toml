# Screen variant 1: training-time augmentation, with the 60-epoch budget it needs to pay off.
# Measured on fold0: 0.8898 (macro F1 0.8609) versus 0.8616 (0.7999) for the 30-epoch baseline.
# At 30 epochs the same augmentation was neutral-to-worse; the budget is what unlocks it.

[data]
augment = true

[train]
epochs = 60
